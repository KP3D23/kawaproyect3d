<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KawaProyects3D | Estudio de Manufactura</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #ea580c;
            --accent-hover: #c2410c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 20px; min-height: 100vh; }
        
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
        
        header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 10px; }
        h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; }
        h1 span { color: var(--accent); }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: color 0.3s; }
        .nav-links a:hover { color: var(--accent); }

        /* Efecto Glassmorphism */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            padding: 25px;
            transition: transform 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-3px); }
        
        h2 { font-size: 1.2rem; color: var(--accent); margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin: 12px 0 6px 0; font-weight: 500; }
        
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 8px;
            background: rgba(15, 23, 42, 0.6); border: 1px solid var(--glass-border);
            color: var(--text-main); font-size: 0.95rem; outline: none;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        button {
            width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 8px;
            background: var(--accent); color: white; font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: var(--accent-hover); }
        button:disabled { background: #334155; cursor: not-allowed; color: var(--text-muted); }

        .precio-box {
            margin-top: 20px; padding: 15px; border-radius: 10px;
            background: rgba(234, 88, 12, 0.1); border: 1px dashed var(--accent);
        }
        .precio-box .total { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .precio-box .anticipo { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; }

        /* Visor de imágenes simulado */
        .visor-box {
            width: 100%; height: 300px; border-radius: 12px;
            background: rgba(0, 0, 0, 0.4); border: 1px solid var(--glass-border);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .visor-box img { max-width: 100%; max-height: 100%; display: none; }
        .placeholder-text { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>KAWA<span>PROYECTS3D</span></h1>
        <div class="nav-links">
            <span id="estado-conexion" style="margin-right: 15px; color: #f87171;">🔴 Verificando conexión...</span>
            <a href="taller.html">Ir al Panel de Taller →</a>
        </div>
    </header>

    <!-- Módulo 1: Cotizador -->
    <div class="glass-card">
        <h2>📋 1. Configura tu Proyecto</h2>
        
        <label>Nombre del Cliente</label>
        <input type="text" id="cliente-nombre" placeholder="Ej: Carlos Andrade">
        
        <label>Teléfono de Contacto</label>
        <input type="text" id="cliente-telefono" placeholder="Ej: 0414-0000000">
        
        <label>Tipo de Producto</label>
        <select id="tipo-producto">
            <option value="letrero_neon">Letrero Neón Flex</option>
            <option value="letrero_pvc">Letrero PVC / Acrílico</option>
            <option value="letrero_3d">Letrero 3D Relieve</option>
            <option value="llavero">Llavero Personalizado</option>
            <option value="figura">Figura Técnica 3D</option>
        </select>
        
        <div class="grid-2">
            <div>
                <label>Ancho (cm)</label>
                <input type="number" id="dim-ancho" value="30" min="1">
            </div>
            <div>
                <label>Alto (cm)</label>
                <input type="number" id="dim-alto" value="20" min="1">
            </div>
        </div>

        <label>Especificaciones / Colores</label>
        <textarea id="parametros-extra" rows="3" placeholder="Detalles de acabado, luces, anclajes..."></textarea>

        <div class="precio-box">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span>Inversión Total:</span>
                <span class="total" id="precio-total">$0.00 USD</span>
            </div>
            <div class="anticipo">Anticipo requerido (50%): <strong id="precio-anticipo">$0.00 USD</strong></div>
        </div>

        <button id="btn-enviar-orden">Confirmar Pedido</button>
    </div>

    <!-- Módulo 2: Previsualización (IA Desactivada temporalmente) -->
    <div class="glass-card">
        <h2>✨ 2. Estudio Creativo</h2>
        
        <div class="visor-box">
            <div class="placeholder-text" id="placeholder-2d">
                Sube tu logo para visualizar tu diseño.<br>
                <small>(Motor IA temporalmente en pausa técnica)</small>
            </div>
            <img id="preview-2d" alt="Tu diseño">
        </div>

        <label style="margin-top: 20px;">Sube tu diseño (PNG, JPG):</label>
        <input type="file" id="input-imagen-cliente" accept="image/*" style="background: transparent; padding: 10px 0; border: none;">

        <hr style="border: 0; border-top: 1px solid var(--glass-border); margin: 25px 0;">

        <h2>🔍 Rastrear Pedido Activo</h2>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="buscar-orden-id" placeholder="# de Orden">
            <button id="btn-buscar-orden" style="margin-top: 0; width: 150px; background: #2563eb;">Buscar</button>
        </div>
        <div id="resultado-rastreo" style="margin-top: 15px; font-size: 0.9rem; color: var(--text-muted);"></div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
