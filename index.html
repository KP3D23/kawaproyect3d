<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KawaProyects3D | Estudio de Manufactura Digital</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

        :root {
            --bg-base: #0a1110;
            --accent-kawa: #769789;
            --accent-glow: #95baaa;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(118, 151, 137, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 15% 50%, rgba(118, 151, 137, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            padding: 30px 20px;
        }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        header {
            max-width: 1200px; margin: 0 auto 30px auto; display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 20px; border-bottom: 1px solid var(--glass-border);
        }

        h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        h1 span { color: var(--accent-kawa); text-shadow: 0 0 15px rgba(118, 151, 137, 0.4); }

        .nav-links { display: flex; align-items: center; gap: 15px; }
        .btn-outline { background: transparent; border: 1px solid var(--accent-kawa); color: var(--text-main); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: 500; }
        .btn-outline:hover { background: var(--accent-kawa); color: #0a1110; }

        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 35px; position: relative; overflow: hidden;
        }
        .glass-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(118, 151, 137, 0.4), transparent); }

        h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 25px; color: #fff; display: flex; align-items: center; gap: 10px; }
        h2 i { color: var(--accent-kawa); font-style: normal; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin: 15px 0 8px 0; font-weight: 500; }

        input, select, textarea {
            width: 100%; padding: 14px 16px; border-radius: 12px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05); color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.3s ease;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-kawa); background: rgba(0, 0, 0, 0.5); box-shadow: 0 0 10px rgba(118, 151, 137, 0.2); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }

        .btn-primary {
            width: 100%; padding: 16px; margin-top: 25px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-kawa), var(--accent-glow));
            color: #050810; font-weight: 700; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 15px rgba(118, 151, 137, 0.3); transition: all 0.3s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(118, 151, 137, 0.5); }
        .btn-primary:disabled { background: #334155; color: #94a3b8; pointer-events: none; box-shadow: none; }

        .precio-box {
            margin-top: 25px; padding: 20px; border-radius: 16px; background: linear-gradient(145deg, rgba(255,255,255,0.02), rgba(0,0,0,0.3));
            border: 1px solid rgba(118, 151, 137, 0.3);
        }
        .precio-box .total-row { display: flex; justify-content: space-between; align-items: center; }
        .precio-box .total { font-size: 1.8rem; font-weight: 700; color: #fff; text-shadow: 0 0 10px rgba(118, 151, 137, 0.4); }
        .precio-box .anticipo { font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px; }

        .visor-box { width: 100%; height: 320px; border-radius: 16px; background: rgba(0, 0, 0, 0.4); border: 1px dashed rgba(118, 151, 137, 0.4); display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; }
        .visor-box img { max-width: 100%; max-height: 100%; display: none; border-radius: 12px; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; background: rgba(0,0,0,0.3); padding: 5px; border-radius: 12px; border: 1px solid var(--glass-border); }
        .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.3s; }
        .tab-btn.active { background: rgba(118, 151, 137, 0.2); color: #fff; border: 1px solid rgba(118, 151, 137, 0.4); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.active { display: flex; }
        .modal-content { width: 100%; max-width: 400px; background: #0a1110; border: 1px solid var(--accent-kawa); border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }

        .pedido-item { padding: 15px; border: 1px solid var(--glass-border); border-radius: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.02); }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: rgba(118, 151, 137, 0.2); color: var(--accent-glow); border: 1px solid var(--accent-kawa); }
    </style>
</head>
<body>

<header>
    <h1>KAWA<span>PROYECTS3D</span></h1>
    <div class="nav-links" id="nav-user-area">
        <button class="btn-outline" onclick="abrirModalAuth()">Iniciar Sesión</button>
    </div>
</header>

<div class="container">
    <!-- Módulo 1: Cotizador -->
    <div class="glass-card">
        <h2><i>⚙️</i> Cotizador Rápido</h2>

        <label>Tipo de Producto</label>
        <select id="tipo-producto">
            <option value="letrero_neon">Letrero Neón Flex LED</option>
            <option value="letrero_pvc">Letrero PVC / Acrílico</option>
            <option value="letrero_3d">Letrero 3D Relieve</option>
            <option value="llavero">Llaveros Personalizados</option>
            <option value="figura">Figura Técnica / Repuesto 3D</option>
            <option value="reconocimiento_3d">Reconocimiento / Trofeo 100% 3D</option>
            <option value="reconocimiento_2d">Reconocimiento Extruido 2D</option>
        </select>

        <div class="grid-2">
            <div><label>Ancho (cm)</label><input type="number" id="dim-ancho" value="30" min="1"></div>
            <div><label>Alto (cm)</label><input type="number" id="dim-alto" value="20" min="1"></div>
        </div>

        <label>Especificaciones Técnicas / Colores</label>
        <textarea id="parametros-extra" rows="3" placeholder="Ej: Letras en acrílico blanco, luces azules..."></textarea>

        <div class="precio-box">
            <div class="total-row">
                <span style="font-weight: 500; color: var(--text-muted);">Inversión Total:</span>
                <span class="total" id="precio-total">$0.00 USD</span>
            </div>
            <div class="anticipo">Anticipo requerido para iniciar (50%): <strong id="precio-anticipo">$0.00 USD</strong></div>
        </div>

        <button id="btn-enviar-orden" class="btn-primary">Confirmar Pedido</button>
    </div>

    <!-- Módulo 2: Estudio Creativo y Pedidos -->
    <div class="glass-card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ai')">✨ Estudio Creativo</button>
            <button class="tab-btn" onclick="switchTab('pedidos')" id="tab-pedidos-btn">📦 Mis Pedidos</button>
        </div>

        <!-- Pestaña IA -->
        <div id="tab-ai" class="tab-content active">
            <div class="visor-box" id="visor-contenedor">
                <div id="placeholder-2d" style="color:var(--text-muted); text-align:center; padding:20px;">
                    Sube tu logo o describe tu idea para que Gemini prepare el diseño.
                </div>
                <img id="preview-2d" alt="Tu diseño">
                <model-viewer id="visor-3d" src="" auto-rotate camera-controls style="display: none; width: 100%; height: 100%;"></model-viewer>
            </div>

            <label style="margin-top: 20px;">Describe tu diseño o indica cómo adaptar tu logo:</label>
            <textarea id="prompt-ia" rows="2" placeholder="Ej: Letrero neón que diga Belleza Eterna en rosado y blanco..."></textarea>

            <div class="grid-2" style="margin-top: 15px;">
                <input type="file" id="input-imagen-cliente" accept="image/*" style="padding: 10px; cursor: pointer;">
                <button id="btn-generar-2d" style="background: rgba(255,255,255,0.9); color: var(--bg-base); padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer;">✨ Preparar Diseño 2D</button>
            </div>

            <div id="status-ia" style="font-size: 0.85rem; color: var(--accent-glow); margin-top: 12px; min-height: 20px;"></div>
            <button id="btn-generar-3d" class="btn-primary" style="display: none; margin-top: 15px;">🧊 Convertir a Modelo 3D</button>
        </div>

        <!-- Pestaña Pedidos -->
        <div id="tab-pedidos" class="tab-content">
            <div id="lista-mis-pedidos">
                <p style="color: var(--text-muted); text-align: center; margin-top: 40px;">Inicia sesión para ver el estado de tus proyectos.</p>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Autenticación -->
<div class="modal-overlay" id="modal-auth">
    <div class="modal-content">
        <h2 id="modal-title" style="margin-bottom: 20px;">Iniciar Sesión</h2>

        <div id="form-register-fields" style="display: none;">
            <label>Nombre Completo</label>
            <input type="text" id="auth-nombre" placeholder="Ej: Carlos Andrade">
            <label>Teléfono (WhatsApp)</label>
            <input type="text" id="auth-telefono" placeholder="Ej: 0414-1234567">
        </div>

        <label>Cédula de Identidad</label>
        <input type="number" id="auth-cedula" placeholder="Ej: 30099859">

        <label>Clave</label>
        <input type="password" id="auth-clave" placeholder="******">

        <button id="btn-auth-action" class="btn-primary" style="margin-top: 20px;">Entrar</button>

        <p style="text-align: center; margin-top: 15px; font-size: 0.85rem; color: var(--text-muted);">
            <span id="auth-toggle-text">¿No tienes cuenta?</span>
            <a href="#" id="auth-toggle-link" style="color: var(--accent-kawa);">Regístrate</a>
        </p>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
