<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KawaProyects3D | Cotizador Inteligente & Taller 3D</title>
    <!-- Visor 3D de Google para archivos .GLB -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --accent: #ea580c;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
        .container { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        
        header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; padding-bottom: 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px; }
        h1 span { color: var(--accent); }
        .nav-links { display: flex; gap: 16px; align-items: center; }
        .nav-links a { color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
        
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }
        h2 { font-size: 1.2rem; margin-bottom: 16px; color: var(--accent); }
        label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; margin-top: 12px; }
        input, select, textarea {
            width: 100%; padding: 10px 12px; border-radius: 8px;
            background: rgba(15, 23, 42, 0.8); border: 1px solid var(--border);
            color: var(--text); font-size: 0.95rem;
        }
        button {
            width: 100%; margin-top: 16px; padding: 12px; border: none; border-radius: 8px;
            background: var(--accent); color: white; font-weight: 600; cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button.btn-ia { background: #2563eb; margin-top: 10px; }
        
        model-viewer { width: 100%; height: 320px; background: rgba(0,0,0,0.35); border-radius: 12px; border: 1px solid var(--border); }
        .status-ia { font-size: 0.85rem; color: #38bdf8; margin-top: 8px; min-height: 20px; }
        .precio-box { margin-top: 16px; padding: 16px; background: rgba(234, 88, 12, 0.12); border: 1px solid var(--accent); border-radius: 10px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; background: #1e293b; margin: 4px 4px 0 0; }
        .libre { color: #4ade80; border: 1px solid #4ade80; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>KAWA<span>PROYECTS3D</span></h1>
        <div class="nav-links">
            <span id="estado-conexion" style="font-size: 0.85rem; color: var(--muted);">Conectando a Supabase...</span>
            <a href="taller.html">Panel Taller →</a>
        </div>
    </header>

    <!-- MÓDULO S1: COTIZADOR Y SOLICITUD -->
    <div class="glass-card">
        <h2>1. Cotizador Paramétrico (Subsistema S1)</h2>
        
        <label>Tu Nombre o Alias (Invitado)</label>
        <input type="text" id="cliente-nombre" placeholder="Ej: Carlos Andrade">

        <label>Teléfono / WhatsApp</label>
        <input type="text" id="cliente-telefono" placeholder="Ej: 0414-0000000">

        <label>Tipo de Servicio</label>
        <select id="tipo-producto">
            <option value="Impresion 3D">Impresión 3D Personalizada (PLA / PETG)</option>
            <option value="Letrero Neon Flex">Letrero Neón Flex LED</option>
            <option value="Llavero / Corporeo">Llaveros o Letras Corpóreas</option>
        </select>

        <label>Gramos estimados o Metros de Neón</label>
        <input type="number" id="cantidad-material" value="100" min="10">

        <label>Horas estimadas de máquina / ensamblaje</label>
        <input type="number" id="horas-trabajo" value="4" min="1">

        <label>Especificaciones (Medidas, colores, luces)</label>
        <textarea id="parametros-ia" rows="2" placeholder="Ej: Luces azules, letras blancas, fondo negro, 40x20cm..."></textarea>

        <div class="precio-box">
            <div style="display:flex; justify-content:space-between;">
                <span>Total Estimado:</span>
                <strong id="precio-total" style="font-size: 1.2rem;">$0.00 USD</strong>
            </div>
            <div style="display:flex; justify-content:space-between; margin-top:6px; color: var(--muted); font-size: 0.9rem;">
                <span>Anticipo requerido (50%):</span>
                <span id="precio-anticipo">$0.00 USD</span>
            </div>
        </div>

        <button id="btn-enviar-orden">Enviar Solicitud a Taller</button>
    </div>

    <!-- VISOR 3D CON IA Y ESTADO EN VIVO DEL TALLER -->
    <div class="glass-card">
        <h2>2. Generador IA 3D & Previsualización</h2>
        
        <model-viewer 
            id="visor-3d"
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            alt="Visor 3D KawaProyects" 
            auto-rotate 
            camera-controls>
        </model-viewer>

        <label>Sube tu imagen o boceto 2D para convertir a 3D:</label>
        <input type="file" id="input-imagen-ia" accept="image/png, image/jpeg, image/webp">
        
        <button id="btn-generar-3d" class="btn-ia">✨ Generar Vista 3D con IA</button>
        <div id="status-ia" class="status-ia"></div>

        <div style="margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border);">
            <strong style="font-size: 0.9rem; color: var(--muted);">Impresoras en Barinas (Tiempo Real):</strong>
            <div id="lista-impresoras" style="margin-top: 8px;">Cargando máquinas...</div>
        </div>
    </div>
</div>

<script type="module">
    import { supabase } from './supa.js';
    import { generarModelo3D } from './ai-3d.js';

    let urlModeloGenerado = null;

    // 1. Verificar conexión y cargar impresoras desde PostgreSQL
    async function cargarImpresoras() {
        const { data, error } = await supabase.from('impresoras_3d').select('*');
        const statusEl = document.getElementById('estado-conexion');
        const listaEl = document.getElementById('lista-impresoras');

        if (error) {
            statusEl.textContent = '❌ Error de conexión: ' + error.message;
            return;
        }
        statusEl.textContent = '🟢 Conectado a Supabase';
        listaEl.innerHTML = data.map(imp => 
            `<span class="badge ${imp.estado_actual === 'Libre' ? 'libre' : ''}">${imp.modelo}: ${imp.estado_actual}</span>`
        ).join('');
    }

    // 2. Generar modelo 3D desde imagen usando TRELLIS.2
    document.getElementById('btn-generar-3d').addEventListener('click', async () => {
        const inputFile = document.getElementById('input-imagen-ia');
        const btnIA = document.getElementById('btn-generar-3d');
        const statusIA = document.getElementById('status-ia');
        const visor = document.getElementById('visor-3d');

        if (!inputFile.files || inputFile.files.length === 0) {
            return alert('Selecciona primero una imagen (PNG o JPG) para generar el modelo 3D.');
        }

        btnIA.disabled = true;
        try {
            const urlGLB = await generarModelo3D(inputFile.files[0], (mensaje) => {
                statusIA.textContent = '⏳ ' + mensaje;
            });

            urlModeloGenerado = urlGLB;
            visor.src = urlGLB;
            statusIA.textContent = '✅ ¡Modelo 3D generado! Puedes rotarlo y hacer zoom arriba.';
        } catch (err) {
            statusIA.textContent = '❌ ' + err.message;
        } finally {
            btnIA.disabled = false;
        }
    });

    // 3. Algoritmo de cotización en vivo
    function calcularCotizacion() {
        const cantidad = parseFloat(document.getElementById('cantidad-material').value) || 0;
        const horas = parseFloat(document.getElementById('horas-trabajo').value) || 0;
        const tipo = document.getElementById('tipo-producto').value;

        const costoMaterial = tipo === 'Letrero Neon Flex' ? (cantidad * 0.15) : (cantidad * 0.05);
        const total = (costoMaterial + (horas * 1.50)).toFixed(2);
        const anticipo = (total / 2).toFixed(2);

        document.getElementById('precio-total').textContent = `$${total} USD`;
        document.getElementById('precio-anticipo').textContent = `$${anticipo} USD`;
        return parseFloat(total);
    }

    document.getElementById('cantidad-material').addEventListener('input', calcularCotizacion);
    document.getElementById('horas-trabajo').addEventListener('input', calcularCotizacion);
    document.getElementById('tipo-producto').addEventListener('change', calcularCotizacion);

    // 4. Guardar Cliente y Orden en Supabase
    document.getElementById('btn-enviar-orden').addEventListener('click', async () => {
        const nombre = document.getElementById('cliente-nombre').value.trim();
        const telefono = document.getElementById('cliente-telefono').value.trim();
        const tipo = document.getElementById('tipo-producto').value;
        const parametros = document.getElementById('parametros-ia').value.trim();
        const total = calcularCotizacion();

        if (!nombre) return alert('Por favor ingresa tu nombre.');

        const { data: cliente, error: errCliente } = await supabase
            .from('clientes')
            .insert([{ nombre, telefono, es_invitado: true }])
            .select()
            .single();

        if (errCliente) return alert('Error guardando cliente: ' + errCliente.message);

        const { data: orden, error: errOrden } = await supabase
            .from('ordenes_trabajo')
            .insert([{
                id_cliente: cliente.id_cliente,
                tipo_producto: tipo,
                parametros_ia: parametros,
                url_modelo_glb: urlModeloGenerado,
                precio_total_usd: total,
                estado: 'Presupuestada'
            }])
            .select()
            .single();

        if (errOrden) return alert('Error creando orden: ' + errOrden.message);

        alert(`✅ ¡Orden #${orden.id_orden} registrada! Anticipo del 50%: $${(total/2).toFixed(2)} USD`);
    });

    // Inicializar
    calcularCotizacion();
    cargarImpresoras();
</script>

</body>
</html>
