<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawa Taller | Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a; --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1); --accent: #38bdf8;
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 30px 20px; }
        
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 30px; }
        h1 { font-size: 1.5rem; color: var(--accent); }
        a { color: var(--text-muted); text-decoration: none; font-weight: 600; }
        
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 25px; margin-bottom: 25px;
        }
        
        h2 { font-size: 1.1rem; color: #fff; margin-bottom: 15px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { text-align: left; padding: 15px 10px; border-bottom: 1px solid var(--glass-border); }
        th { color: var(--text-muted); font-weight: 600; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; background: rgba(56, 189, 248, 0.1); border: 1px solid var(--accent); color: var(--accent); }
        .badge.pendiente { border-color: #ea580c; color: #ea580c; }
        .badge.terminada { border-color: #10b981; color: #10b981; }

        button { background: #334155; border: 1px solid var(--glass-border); color: white; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:hover { background: var(--accent); }
        button.btn-cerrar { background: #10b981; border: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>CONTROL DE PLANTA (S2/S3)</h1>
        <a href="index.html">← Volver al Portal</a>
    </header>

    <div class="glass-card">
        <h2>🛠️ Órdenes Activas en Taller</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Orden</th>
                        <th>Cliente</th>
                        <th>Producto</th>
                        <th>Estado</th>
                        <th>Total ($)</th>
                        <th>Acción Operador</th>
                    </tr>
                </thead>
                <tbody id="tabla-ordenes-taller">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
